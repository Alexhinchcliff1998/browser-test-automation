<!doctype html><html lang="en"><meta charset="utf-8"><title>Demo checkout</title><style>body{font:16px system-ui;max-width:700px;margin:40px auto;padding:20px;background:#f0f4f8;color:#17324d}section{background:white;padding:20px;border-radius:12px;margin:12px 0}button,input{font:inherit;padding:8px;margin:5px}label{display:block}button{cursor:pointer}</style><h1>Demo checkout</h1><section><h2>Shipping box</h2><p>$12.00 each</p><button id="add">Add to cart</button><button id="remove">Remove one</button><p>Quantity: <strong id="qty">0</strong></p><p>Total: <strong id="total">$0.00</strong></p></section><section><form id="checkout"><label>Email <input type="email" id="email" required></label><label><input type="checkbox" id="terms" required> Accept demo terms</label><button type="submit">Place order</button></form><p id="status" role="status"></p></section><script>let qty=0;const $=s=>document.querySelector(s);function update(){ $('#qty').textContent=qty;$('#total').textContent='$'+(qty*12).toFixed(2);$('#status').textContent='';}$('#add').onclick=()=>{qty++;update()};$('#remove').onclick=()=>{qty=Math.max(0,qty-1);update()};$('#checkout').onsubmit=e=>{e.preventDefault();if(!qty){$('#status').textContent='Your cart is empty.';return;}qty=0;update();$('#status').textContent='Demo order confirmed.';e.target.reset()};</script></html>
